apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-guardian
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mcakohli/k8s-guardian.git
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true