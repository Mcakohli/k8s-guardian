apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: validate-image-tag
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - argocd
    validate:
      message: "Using the ':latest' image tag is forbidden. Use explicit semantic versions."
      pattern:
        spec:
          containers:
          - image: "!*:latest"